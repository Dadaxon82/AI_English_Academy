name: CI

# Har PR va push'da: o'rnatish → typecheck → eslint → vitest → build → e2e.
# Bitta qadam qizil bo'lsa — PR'ni merge qilmang (branch protection'da
# "CI / checks" va "CI / e2e"ni majburiy qilib qo'ying).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_BASE: /AI_English_Academy/
      # Boshlang'ich JS byudjeti (gzip ≤ 300 KB)
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # 5 asosiy oqim, 1280px va 375px (konsol xatosi va gorizontal scroll yo'q)
      - run: npm run e2e
      # 16 marshrut — Playwright Chromium bilan render tekshiruvi
      - run: npm run render:check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
