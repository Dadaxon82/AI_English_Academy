name: CI

# Har PR va push'da: o'rnatish → typecheck → eslint → vitest → build → e2e.
# Bitta qadam qizil bo'lsa — PR'ni merge qilmang (branch protection'da
# "CI / checks" va "CI / e2e"ni majburiy qilib qo'ying).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npx vitest run
      # README'dagi kontent sonlari eskirmaganmi (qo'lda emas — `npm run stats`)
      - run: npm run stats -- --check
      - run: npm run build
        env:
          VITE_BASE: /AI_English_Academy/
      # Boshlang'ich JS byudjeti (gzip ≤ 300 KB)
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # Supabase migratsiyalari va RLS qoidalari — haqiqiy Postgres'da
  # (`supabase/tests/*.test.sql`: hamjamiyat tekshiruvi ruxsatlari, moderatsiya).
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-sql.sh

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # apt serverlari javob bermasa (DNS) o'rnatish 10 daqiqagacha osilib qoladi: 4 daqiqa
      # kutamiz, bo'lmasa tizim paketlarisiz o'rnatamiz (runner'da Chromium kutubxonalari bor).
      - name: Playwright Chromium
        run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      # 5 asosiy oqim, 1280px va 375px (konsol xatosi va gorizontal scroll yo'q)
      - run: npm run e2e
      # 16 marshrut — Playwright Chromium bilan render tekshiruvi
      - run: npm run render:check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
