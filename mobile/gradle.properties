# RAM cheklangan mashinada (16 GB, boshqa yuklar bilan) bitta daemon yetarli:
# Kotlin kompilyatori jarayon ichida ishlaydi — alohida kotlin-daemon ochilmaydi.
org.gradle.jvmargs=-Xmx1200m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx700m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true
